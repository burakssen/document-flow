[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Burak Şen", email = "buraksen7@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
backend = "app:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
